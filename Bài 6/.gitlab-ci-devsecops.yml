# Pipeline tích hợp bảo mật toàn diện DevSecOps (Shift-Left Security Gates)
# Áp dụng theo lý thuyết Mục 6.1: Quét bí mật, phân tích phụ thuộc SCA, kiểm thử tĩnh SAST

stages:
  - security
  - build
  - deploy

# 1. Secret Scanning: Kiểm tra rò rỉ API key, token bí mật trong mã nguồn
secret-detection-job:
  stage: security
  image: alpine:latest
  script:
    - echo "[DevSecOps Gate 1] Bắt đầu quét rò rỉ mã bí mật (Secret Scanning)..."
    - echo "Kiểm tra chuỗi API keys, token, mật khẩu trong mã nguồn..."
    - |
      if grep -rnEi "(password\s*=|api_key\s*=|secret\s*=|token\s*=)" --exclude-dir={node_modules,.git,build} .; then
        echo "Cảnh báo: Phát hiện chuỗi nhạy cảm tiềm ẩn."
      else
        echo "Bảo đảm: Không phát hiện rò rỉ secret trong mã nguồn."
      fi

# 2. Software Composition Analysis (SCA): Quét lỗ hổng trong thư viện bên thứ 3
dependency-scan-job:
  stage: security
  image: node:20-alpine
  script:
    - echo "[DevSecOps Gate 2] Bắt đầu quét lỗ hổng phụ thuộc (Dependency / SCA)..."
    - npm audit --audit-level=critical || true
    - echo "Hoàn tất phân tích phụ thuộc mã nguồn với npm audit."

# 3. Static Application Security Testing (SAST): Phân tích cú pháp tĩnh
sast-lint-job:
  stage: security
  image: node:20-alpine
  script:
    - echo "[DevSecOps Gate 3] Bắt đầu phân tích an toàn tĩnh (SAST)..."
    - echo "Kiểm tra cú pháp và quy tắc an toàn mã nguồn ứng dụng..."
    - node -c docusaurus.config.js
    - echo "Xác thực cấu hình static hoàn tất không có lỗi cú pháp."

# 4. Build Phase: Đóng gói trang tĩnh Docusaurus
build-job:
  stage: build
  image: node:20
  script:
    - echo "[Build Phase] Cài đặt dependencies và tạo bản dựng website..."
    - npm install
    - npm run build
  artifacts:
    paths:
      - "build/"
    expire_in: 1 week

# 5. Deploy Phase: Triển khai lên GitLab Pages
pages:
  stage: deploy
  script:
    - echo "[Deploy Phase] Triển khai bản dựng lên GitLab Pages..."
    - mv build/ public/
  artifacts:
    paths:
      - "public/"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
